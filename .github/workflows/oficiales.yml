name: Validar datos oficiales
on:
  pull_request:
    paths: ["datos/oficiales/**", "datos/manifiesto.json"]
  push:
    branches: [main]
    paths: ["datos/oficiales/**", "datos/manifiesto.json"]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validar_oficiales.py
